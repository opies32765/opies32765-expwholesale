# EW SSH hardening — added 2026-07-27
#
# Loaded via `Include /etc/ssh/sshd_config.d/*.conf` (sshd_config line 12, ahead of every
# keyword). sshd takes the FIRST value it sees for a keyword, and the glob is alphabetical,
# so this "10-" file wins over 50-cloud-init.conf (which sets PasswordAuthentication yes).
#
# WHY:
#   C1 takes ~24,000 failed SSH auth attempts a day from ~139 hosts — 3,432 of them against
#   root — plus a dictionary of ubuntu/admin/debian/pi/mysql. None has ever succeeded: across
#   every retained auth log there are 9,256 successful logins and ALL of them are publickey,
#   zero password, zero keyboard-interactive. So turning passwords off costs nothing and
#   removes the entire attack surface those bots are aiming at.
#
#   The visible symptom was sshd hitting MaxStartups (10 unauthenticated connections) and
#   randomly dropping legitimate admin sessions. Note that load is NOT all hostile: the
#   opswatch-vps key from 155.117.46.160 alone made 28,964 successful logins in 7 days
#   (~3/min), so the queue is partly self-inflicted. Raising the cap protects real work
#   while fail2ban sheds the hostile share.

PasswordAuthentication no
KbdInteractiveAuthentication no

# Key-only for root. Every one of our automation keys (opswatch-vps, dp-sync, c2-failover,
# lxc-pull, rrsync backup keys, c3-to-c1-ollama-tunnel) is a publickey entry, so this is a
# no-op for them and a hard stop for the 3,432 daily root password guesses.
PermitRootLogin prohibit-password

# 10 was the default and it is far too small for a host under this much scan traffic plus
# our own polling. 100 concurrent unauthenticated connections before random drop, hard cap 200.
MaxStartups 100:30:200

# Shrink how long a bot can hold an unauthenticated slot open (default 2m).
LoginGraceTime 30
MaxAuthTries 3
