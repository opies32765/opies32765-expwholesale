# RECON_HOME_TRANSPORT_LIVE_2026_08_05
#
# Takes the Home Base wizard's transport dispatch OUT of staging.
#
#   Cobra / local tow  -> texts Jordan   +1 954 609 2424
#   Out of the area    -> emails Austin  austin@experience-wholesale.com
#
# Until now both went to the operator with a [TEST] prefix. With this set the
# prefix is dropped and real people are dispatched by a click on the recon
# board. Nothing else about the feature changes.
#
# Guards that stay in force regardless of this flag:
#   * nothing is preselected in the wizard -- confirm is refused with no choice
#   * "Not yet -- I'll arrange it" sends nothing
#   * transport fires only AFTER the move succeeds
#   * one arrangement per car; a second attempt returns 409
#
# Revert: delete this file, daemon-reload, restart -> straight back to staged.
[Service]
Environment=RECON_TRANSPORT_LIVE=1
