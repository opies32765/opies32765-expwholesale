<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Check-In · EW Recon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11151a;color:#e5e7eb;font:15px/1.4 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
.topbar{background:#0b0e12;display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:5}
.topbar .brand{font-weight:800;font-size:18px}.brand .r{color:#e23b3b}
.topbar a{color:#9ca3af;text-decoration:none;font-size:13px;margin-left:auto;border:1px solid #374151;padding:6px 12px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:18px;margin:0 0 4px}
.sub{color:#9ca3af;font-size:13px;margin-bottom:6px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;font-weight:700;margin:18px 0 9px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:12px;background:#1b212a;border:2px solid #232a34;color:#cbd5e1;font-weight:600;font-size:14px;cursor:pointer}
.sbtn .d{width:11px;height:11px;border-radius:50%;flex:none}
.sbtn.on{border-color:#fff;background:#2b333f;color:#fff}
.scanbtn{margin-top:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:32px;border-radius:18px;background:linear-gradient(180deg,#e23b3b,#b01818);color:#fff;border:0;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(226,59,59,.32)}
.scanbtn:active{transform:scale(.99)}
.scanbtn .big{font-size:44px;line-height:1}
.scanbtn.busy{opacity:.65;pointer-events:none}
.result{margin-top:16px;padding:15px 16px;border-radius:14px;font-weight:600;display:none;font-size:15px}
.result.ok{background:#0c2a17;border:1px solid #16a34a;color:#d1fae5;display:block}
.result.err{background:#2a1313;border:1px solid #b91c1c;color:#fecaca;display:block}
.result.wait{background:#1b212a;border:1px solid #374151;color:#cbd5e1;display:block}
.recent .it{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;background:#161b22;border:1px solid #232a34;border-radius:10px;margin-bottom:8px;font-size:13px}
.recent .it .v{color:#9ca3af;font-size:11px;font-family:ui-monospace,monospace}
.recent .it .to{color:#86efac;font-weight:700;white-space:nowrap}
</style>
<script>try{var _s=document.getElementById('ew-app-simplify');if(_s&&_s.parentNode)_s.parentNode.removeChild(_s);}catch(e){}</script>
</head><body>
<div class="topbar"><span class="brand"><span class="r">EW</span>RECON</span><a href="/recon">&larr; Board</a></div>
<div class="wrap">
  <h1>📲 Vehicle Check-In</h1>
  <div class="sub">Pick the status, then scan the VIN anywhere on the car — windshield, door-jamb, or dash. It moves automatically.</div>

  <div class="lbl">1 · Check car in to</div>
  <div class="steps" id="steps">
    {% for s in steps %}
    <button class="sbtn {% if s.code=='arrived_home' %}on{% endif %}" data-code="{{ s.code }}" data-name="{{ s.name }}" onclick="pick(this)">
      <span class="d" style="background:{{ dot_colors.get(s.code,'#9ca3af') }}"></span>{{ s.name }}
    </button>
    {% endfor %}
  </div>

  <div class="lbl">2 · Scan the VIN</div>
  <button class="scanbtn" id="scanBtn" onclick="document.getElementById('photo').click()">
    <span class="big">📷</span>
    <span id="scanLbl">Scan VIN</span>
  </button>
  <input id="photo" type="file" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this)">

  <div class="result" id="result"></div>

  <div class="recent" id="recentWrap" style="display:none">
    <div class="lbl">Checked in this session</div>
    <div id="recent"></div>
  </div>
</div>
<script>
var selCode='arrived_home', selName='Arrived Home Base';
(function(){var on=document.querySelector('.sbtn.on'); if(on){selCode=on.dataset.code;selName=on.dataset.name;}})();
function pick(b){ document.querySelectorAll('.sbtn').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); selCode=b.dataset.code; selName=b.dataset.name; }
function busy(b){ var btn=document.getElementById('scanBtn'); btn.classList.toggle('busy',b); document.getElementById('scanLbl').textContent=b?'Reading VIN…':'Scan VIN'; }
function res(cls,html){ var r=document.getElementById('result'); r.className='result '+cls; r.innerHTML=html; }
function addRecent(label,vin,to){ var w=document.getElementById('recentWrap'),l=document.getElementById('recent'); w.style.display='block'; var d=document.createElement('div'); d.className='it'; d.innerHTML='<span>'+label+'<br><span class="v">'+vin+'</span></span><span class="to">'+to+'</span>'; l.insertBefore(d,l.firstChild); }
async function onPhoto(input){
  var f=input.files&&input.files[0]; if(!f){return;}
  busy(true); res('wait','📷 Reading VIN…');
  var fd=new FormData(); fd.append('photo',f);
  try{
    var r=await fetch('/api/recon/checkin-scan',{method:'POST',body:fd});
    var j=await r.json();
    if(!j.ok){ res('err','⚠ '+(j.error||'could not read the VIN')+(j.vin?('<br><span style="opacity:.7">read: '+j.vin+'</span>'):'')); busy(false); input.value=''; return; }
    res('wait','Found <b>'+(j.label||j.vin)+'</b> — moving to '+selName+'…');
    var mr=await fetch('/api/recon/'+j.unit_id+'/move',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to_step:selCode})});
    var mj=await mr.json();
    if(mr.ok && !mj.error){
      var was=(j.current_step && j.current_step!=selName)?(' <span style="opacity:.7;font-weight:400">(was '+j.current_step+')</span>'):'';
      res('ok','✓ <b>'+(j.label||j.vin)+'</b>'+(j.stock_no?(' · '+j.stock_no):'')+'<br>→ <b>'+selName+'</b>'+was);
      addRecent((j.label||j.vin)+(j.stock_no?(' · '+j.stock_no):''), j.vin, selName);
    } else { res('err','⚠ '+(mj.error||'could not move the car')); }
  }catch(e){ res('err','⚠ network error — try again'); }
  busy(false); input.value='';
}
</script>
</body></html>
