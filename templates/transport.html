<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transport — Experience Wholesale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0b0f19;color:#e2e8f0;min-height:100vh;padding:16px}
.wrap{max-width:560px;margin:0 auto}
.head{display:flex;align-items:center;gap:12px;margin:8px 0 16px}
.logo-mark{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:11px;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.head h1{font-size:19px;font-weight:800;color:#f1f5f9}
.head .sub{font-size:12px;color:#64748b;margin-top:1px}
.tabs{display:flex;gap:6px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:5px;margin-bottom:14px}
.tab{flex:1;padding:10px;background:transparent;border:none;border-radius:8px;color:#94a3b8;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tab.on{background:#1d4ed8;color:#fff}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:20px;margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input,select,textarea{width:100%;padding:12px 14px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;color:#e2e8f0;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#3b82f6}
.combo{position:relative}
.combo-panel{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:#0f172a;border:1px solid #334155;border-radius:10px;max-height:264px;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.combo-row{padding:13px 14px;font-size:15px;color:#e2e8f0;border-bottom:1px solid #1e293b;cursor:pointer}
.combo-row:last-child{border-bottom:none}
.combo-row:active{background:#1e293b}
.combo-empty{padding:13px 14px;font-size:13px;color:#64748b}
.flip{display:flex;justify-content:center;margin:10px 0}
.flip button{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:20px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.flip button:hover{background:#334155;color:#e2e8f0}
.route{display:none;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:14px 16px;margin:14px 0}
.route.show{display:flex;justify-content:space-around}
.route .item{text-align:center}
.route .item .k{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px}
.route .item .v{font-size:17px;font-weight:700;color:#e2e8f0;margin-top:2px}
.quote-row{display:flex;align-items:center;gap:8px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:2px 14px}
.quote-row .dollar{font-size:22px;font-weight:800;color:#34d399}
.quote-row input{border:none;background:transparent;font-size:24px;font-weight:800;color:#34d399;padding:10px 0}
.toggle{display:flex;gap:8px;margin:14px 0}
.toggle button{flex:1;padding:11px;background:#0f172a;border:1px solid #1e293b;border-radius:10px;color:#94a3b8;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.toggle button.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
textarea{min-height:62px;resize:vertical;font-size:14px}
.actions{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-ghost{background:#1e293b;color:#cbd5e1;border:1px solid #334155}
.btn-ghost:hover{background:#334155}
.mt{margin-top:14px}
.hint{font-size:11px;color:#475569;margin-top:6px}
.trk-summary{margin-top:10px;font-size:12px;color:#64748b}
.trk-h{font-size:12px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin:18px 4px 8px}
.trk-car{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px 15px;margin-bottom:8px}
.trk-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.trk-ymm{font-size:15px;font-weight:700;color:#f1f5f9}
.trk-route{font-size:13px;color:#94a3b8;margin-top:4px}
.trk-dates{font-size:12px;color:#475569;margin-top:3px}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
.badge-dd{background:#1e3a8a;color:#bfdbfe}
.badge-dc{background:#4c1d95;color:#ddd6fe}
.trk-empty{padding:18px;text-align:center;color:#64748b;font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1d4ed8;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo-mark">EW</div>
    <div><h1>Transport</h1><div class="sub">Quote &amp; tracker</div></div>
  </div>
  <div class="tabs">
    <button id="tab-quote" class="tab on" onclick="showTab('quote')">Quote</button>
    <button id="tab-tracker" class="tab" onclick="showTab('tracker')">Tracker</button>
  </div>

  <div id="view-quote">
    <div class="card">
      <label>Origin</label>
      <div class="combo"><input id="origin" placeholder="Search dealer…" autocomplete="off"><div class="combo-panel" id="origin-panel"></div></div>
      <div class="flip"><button type="button" onclick="flip()">&#8645; Flip Route</button></div>
      <label>Destination</label>
      <div class="combo"><input id="dest" placeholder="Search dealer…" autocomplete="off"><div class="combo-panel" id="dest-panel"></div></div>
      <div class="route" id="route">
        <div class="item"><div class="k">Miles</div><div class="v" id="miles">&mdash;</div></div>
        <div class="item"><div class="k">Transit</div><div class="v" id="transit">&mdash;</div></div>
      </div>
      <div class="mt"><label>Quote Price</label>
        <div class="quote-row"><span class="dollar">$</span><input id="price" inputmode="numeric" placeholder="0"></div>
        <div class="hint" id="suggest"></div>
      </div>
      <div class="toggle">
        <button type="button" id="t-open" class="on" onclick="setEnc(false)">Open</button>
        <button type="button" id="t-enc" onclick="setEnc(true)">Enclosed</button>
      </div>
      <label>Notes (optional)</label>
      <textarea id="notes" placeholder="e.g. Urgent pickup, inoperable vehicle…"></textarea>
      <div class="actions">
        <button class="btn btn-primary" onclick="copyQuote()">Copy Quote</button>
        <button class="btn btn-ghost" onclick="emailQuote()">Email Format</button>
      </div>
    </div>
  </div>

  <div id="view-tracker" style="display:none">
    <div class="card">
      <input id="trk-search" placeholder="Filter by make, city, state, carrier…" autocomplete="off" oninput="renderTracker()">
      <div id="trk-summary" class="trk-summary">Loading…</div>
    </div>
    <div id="trk-list"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var DEALERS=[], sel={origin:null,dest:null}, enclosed=false, lastEst=null, suggested=null, TRACKER=null;
function $(id){return document.getElementById(id);}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1600);}
function abbr(s){var m={"alabama":"AL","alaska":"AK","arizona":"AZ","arkansas":"AR","california":"CA","colorado":"CO","connecticut":"CT","delaware":"DE","florida":"FL","georgia":"GA","hawaii":"HI","idaho":"ID","illinois":"IL","indiana":"IN","iowa":"IA","kansas":"KS","kentucky":"KY","louisiana":"LA","maine":"ME","maryland":"MD","massachusetts":"MA","michigan":"MI","minnesota":"MN","mississippi":"MS","missouri":"MO","montana":"MT","nebraska":"NE","nevada":"NV","new hampshire":"NH","new jersey":"NJ","new mexico":"NM","new york":"NY","north carolina":"NC","north dakota":"ND","ohio":"OH","oklahoma":"OK","oregon":"OR","pennsylvania":"PA","rhode island":"RI","south carolina":"SC","south dakota":"SD","tennessee":"TN","texas":"TX","utah":"UT","vermont":"VT","virginia":"VA","washington":"WA","west virginia":"WV","wisconsin":"WI","wyoming":"WY"};var k=(s||"").toLowerCase().trim();return m[k]||(s||"").toUpperCase().slice(0,2);}
function showTab(t){
  $("view-quote").style.display=t==="quote"?"block":"none";
  $("view-tracker").style.display=t==="tracker"?"block":"none";
  $("tab-quote").classList.toggle("on",t==="quote");
  $("tab-tracker").classList.toggle("on",t==="tracker");
  if(t==="tracker"&&!TRACKER)loadTracker();
}
function setEnc(v){enclosed=v;$("t-open").classList.toggle("on",!v);$("t-enc").classList.toggle("on",v);recompute();}
function flip(){var t=sel.origin;sel.origin=sel.dest;sel.dest=t;$("origin").value=sel.origin?sel.origin.label:"";$("dest").value=sel.dest?sel.dest.label:"";recompute();}
function load(){
  fetch("/api/transport/dealers").then(function(r){return r.json();}).then(function(d){
    (d.dealers||[]).forEach(function(x){
      if(/do not use|^\s*-dup/i.test(x.name||""))return;
      if(!x.zip)return;
      var st=abbr(x.state);
      var label=x.name+(x.city?" — "+x.city:"")+(st?", "+st:"");
      DEALERS.push({label:label,zip:x.zip,search:(label+" "+x.zip).toLowerCase()});
    });
    DEALERS.sort(function(a,b){return a.label<b.label?-1:1;});
  });
}
function renderPanel(which){
  var q=$(which).value.toLowerCase().trim(), panel=$(which+"-panel");
  var matches=DEALERS.filter(function(d){return !q||d.search.indexOf(q)>=0;}).slice(0,60);
  panel.innerHTML="";
  if(!matches.length){var e=document.createElement("div");e.className="combo-empty";e.textContent="No match";panel.appendChild(e);panel.style.display="block";return;}
  matches.forEach(function(d){
    var row=document.createElement("div");row.className="combo-row";row.textContent=d.label;
    row.addEventListener("click",function(){pick(which,d);});
    panel.appendChild(row);
  });
  panel.style.display="block";
}
function pick(which,d){sel[which]=d;$(which).value=d.label;$(which+"-panel").style.display="none";recompute();}
function recompute(){
  if(!sel.origin||!sel.dest){$("route").classList.remove("show");return;}
  fetch("/api/transport/estimate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({origin_zip:sel.origin.zip,dest_zip:sel.dest.zip,vehicle_class:"sedan",enclosed:enclosed})})
   .then(function(r){return r.json();}).then(function(d){
     if(d.error){$("route").classList.remove("show");return;}
     lastEst=d;
     $("miles").textContent=d.miles.toLocaleString();
     $("transit").textContent=d.transit||"—";
     $("route").classList.add("show");
     var cur=$("price").value;
     if(cur===""||cur===String(suggested)){$("price").value=d.estimate;}
     suggested=d.estimate;
     $("suggest").textContent="Suggested (market): $"+d.estimate.toLocaleString()+" — adjust to your price";
   });
}
function quoteText(){
  var o=$("origin").value||"—", dd=$("dest").value||"—", p=$("price").value||"—";
  var lines=["Auto Transport Quote","","From: "+o,"To: "+dd];
  if(lastEst){lines.push("Distance: "+lastEst.miles.toLocaleString()+" miles");lines.push("Transit: "+(lastEst.transit||""));}
  lines.push("Type: "+(enclosed?"Enclosed":"Open"));
  lines.push("Price: $"+p);
  var n=$("notes").value.trim();if(n){lines.push("");lines.push("Notes: "+n);}
  return lines.join("\n");
}
function copyQuote(){navigator.clipboard.writeText(quoteText()).then(function(){toast("Quote copied");}).catch(function(){toast("Copy failed — long-press to copy");});}
function emailQuote(){var subj=encodeURIComponent("Auto Transport Quote — "+($("origin").value||"")+" to "+($("dest").value||""));window.location.href="mailto:?subject="+subj+"&body="+encodeURIComponent(quoteText());}
function loadTracker(){
  $("trk-list").innerHTML='<div class="trk-empty">Loading…</div>';
  fetch("/api/transport/tracker").then(function(r){return r.json();}).then(function(d){TRACKER=d;renderTracker();}).catch(function(){$("trk-summary").textContent="";$("trk-list").innerHTML='<div class="trk-empty">Could not load tracker.</div>';});
}
function carRow(c){
  var badge='<span class="badge badge-'+(c.company==="DC"?"dc":"dd")+'">'+esc(c.company||"?")+'</span>';
  var dt=(c.est_pickup||c.est_delivery)?'<div class="trk-dates">Est '+esc(c.est_pickup||"?")+' &rarr; '+esc(c.est_delivery||"?")+(c.status?' · '+esc(c.status):'')+'</div>':"";
  return '<div class="trk-car"><div class="trk-top"><span class="trk-ymm">'+esc(c.ymm)+'</span>'+badge+'</div><div class="trk-route">'+esc(c.pickup)+' &rarr; '+esc(c.delivery)+'</div>'+dt+'</div>';
}
function renderTracker(){
  if(!TRACKER){return;}
  if(TRACKER.error){$("trk-summary").textContent="";$("trk-list").innerHTML='<div class="trk-empty">'+esc(TRACKER.error)+'</div>';return;}
  var q=($("trk-search").value||"").toLowerCase().trim();
  function filt(list){return (list||[]).filter(function(c){return !q||(c.ymm+" "+c.pickup+" "+c.delivery+" "+c.company).toLowerCase().indexOf(q)>=0;});}
  var it=filt(TRACKER.in_transit), pe=filt(TRACKER.pending);
  var ci=(TRACKER.counts&&TRACKER.counts.in_transit)||0, cp=(TRACKER.counts&&TRACKER.counts.pending)||0;
  $("trk-summary").textContent=ci+" in transit · "+cp+" pending pickup"+(q?" (filtered)":"");
  var html="";
  html+='<div class="trk-h">In Transit ('+it.length+')</div>';
  html+= it.length?it.map(carRow).join(""):'<div class="trk-empty">None</div>';
  html+='<div class="trk-h">Pending Pickup ('+pe.length+')</div>';
  html+= pe.length?pe.map(carRow).join(""):'<div class="trk-empty">None</div>';
  $("trk-list").innerHTML=html;
}
["origin","dest"].forEach(function(id){
  var inp=$(id);
  inp.addEventListener("input",function(){sel[id]=null;renderPanel(id);});
  inp.addEventListener("focus",function(){try{inp.scrollIntoView({block:"start",behavior:"smooth"});}catch(e){}renderPanel(id);});
  inp.addEventListener("blur",function(){setTimeout(function(){$(id+"-panel").style.display="none";},200);});
});
load();
</script>
</body>
</html>
